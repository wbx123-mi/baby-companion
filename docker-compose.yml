name: baby-companion

services:
  mysql:
    image: mysql:8.4
    container_name: baby-companion-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: baby_companion
      MYSQL_USER: baby_companion
      MYSQL_PASSWORD: local_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password
      TZ: Asia/Shanghai
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
    volumes:
      - baby_companion_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: baby-companion-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: baby_companion_minio
      MINIO_ROOT_PASSWORD: local_minio_password
    command: server /data --console-address ":9001"
    volumes:
      - baby_companion_minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 baby_companion_minio local_minio_password; do sleep 1; done;
      mc mb --ignore-existing local/baby-companion; mc anonymous set none local/baby-companion"

volumes:
  baby_companion_mysql_data:
  baby_companion_minio_data:
